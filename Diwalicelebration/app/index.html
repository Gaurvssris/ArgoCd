
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali!</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(ellipse at bottom, #40105c, #10021f 75%);
}

#sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.content {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

h1 {
  color: #ffe66d;
  font-size: clamp(2.5rem, 9vw, 6rem);
  margin: 10px 0;
  text-shadow: 0 0 15px #ff8c00, 0 0 40px #ff1493;
  animation: glow 2s infinite alternate;
}

h2 {
  color: #ff80bf;
  font-size: clamp(1.4rem, 5vw, 3rem);
  margin: 10px 0;
}

.message {
  font-size: clamp(1.2rem, 4vw, 2rem);
  color: #fff4c2;
  margin: 15px 0;
}

.lights {
  font-size: clamp(2rem, 7vw, 4rem);
  letter-spacing: 8px;
  animation: float 2s ease-in-out infinite alternate;
}

.diyas {
  font-size: clamp(2.5rem, 7vw, 4rem);
  margin-top: 20px;
  filter: drop-shadow(0 0 15px orange);
}

button {
  margin-top: 24px;
  padding: 14px 26px;
  border: 0;
  border-radius: 30px;
  background: linear-gradient(90deg, #ff8a00, #ff1493);
  color: white;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px #ff8a00;
}

button:hover { transform: scale(1.05); }

@keyframes glow {
  from { filter: brightness(0.9); }
  to { filter: brightness(1.35); }
}

@keyframes float {
  from { transform: translateY(0); }
  to { transform: translateY(-14px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<main class="content">
  <div class="lights">✨ 🎇 ✨</div>
  <h1>🪔 Happy Diwali 🪔</h1>
  <h2>Diwali Aane Wali Hai!</h2>
  <p class="message">Enjoy Karna! 🎆🥳</p>
  <div class="diyas">🪔 🪔 🪔</div>
  <p>May your life shine with happiness and light!</p>
  <button onclick="celebrate()">🎉 Celebrate Diwali 🎉</button>
</main>

<script>
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
let width, height, particles = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

function burst(x, y) {
  const colors = ["#ffd700", "#ff1493", "#00ffff",
                  "#ff7f50", "#aaff00", "#ffffff"];

  for (let i = 0; i < 65; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 5;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 65 + Math.random() * 30,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 1 + Math.random() * 3
    });
  }
}

function celebrate() {
  burst(width * (0.2 + Math.random() * 0.6),
        height * (0.15 + Math.random() * 0.45));
  burst(width * (0.2 + Math.random() * 0.6),
        height * (0.15 + Math.random() * 0.45));
}

function animate() {
  ctx.clearRect(0, 0, width, height);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.035;
    p.life--;

    ctx.globalAlpha = Math.max(0, p.life / 90);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();

    if (p.life <= 0) particles.splice(i, 1);
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

// Automatic fireworks every 1.2 seconds
setInterval(() => {
  burst(width * (0.1 + Math.random() * 0.8),
        height * (0.08 + Math.random() * 0.5));
}, 1200);

animate();
</script>
</body>
</html>
