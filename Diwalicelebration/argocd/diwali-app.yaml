
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: diwali-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Gaurvssris/ArgoCd.git
    targetRevision: main
    path: helm/diwali-app
    helm:
      releaseName: diwali-app

  destination:
    server: https://kubernetes.default.svc
    namespace: diwali

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
